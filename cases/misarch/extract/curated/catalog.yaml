# catalog (Kotlin original). Curated; schema: build.py docstring. Anchors are relative to
# services/catalog/src/main/kotlin/org/misarch/catalog/ (migration anchors: relative to services/catalog/).
service: catalog
transactional: >-
  service/*Service.kt @Transactional: every mutation's service method runs in one transaction, the events are
  published inside it, before commit (docs/specs/catalog.md §8); the event handlers and the queries run without a
  transaction
# Spring Data R2DBC saveAll() issues one INSERT per element (perItem). The DB trigger
# trg_check_category_value_product_category (BEFORE INSERT OR UPDATE ON CategoryCharacteristicValueEntity, V1_1) runs
# one SELECT joining ProductVariantVersion, ProductVariant, ProductToCategory and CategoryCharacteristic per written
# value row; it is listed as accesses with `dbTrigger` (sql_schema.py also extracts it: do not count it twice).

tables:
  CategoryEntity: {kind: class, class: Category}
  CategoryCharacteristicEntity:
    kind: class
    class: CategoryCharacteristic
    note: discriminator CATEGORICAL | NUMERICAL (two GraphQL types, one class; unit only for NUMERICAL)
    refs:
      - {attr: categoryId, to: Category, kind: composition, mult: "1"}
  ProductEntity:
    kind: class
    class: Product
    refs:
      - {attr: defaultVariantId, to: ProductVariant, kind: association, mult: "1", note: "NULL only inside createProduct's transaction"}
  ProductVariantEntity:
    kind: class
    class: ProductVariant
    refs:
      - {attr: productId, to: Product, kind: composition, mult: "1"}
      - {attr: currentVersion, to: ProductVariantVersion, kind: association, mult: "1", note: "NULL only inside the creating transaction"}
  ProductVariantVersionEntity:
    kind: class
    class: ProductVariantVersion
    note: immutable once created (a price/name change is a new version)
    refs:
      - {attr: productVariantId, to: ProductVariant, kind: composition, mult: "1"}
      - {attr: taxRateId, to: TaxRate, kind: association, mult: "1", note: "FK into the TaxRate copy (TaxRateEntity); the id only, no rate is frozen"}
  ProductToCategoryEntity:
    kind: join
    joins: [Product, Category]
    field: categories
    inverse: products
    note: "Product.categories [*] <-> Category.products [*]; PRIMARY KEY (productId, categoryId); FKs to ProductEntity and CategoryEntity"
  CategoryCharacteristicValueEntity:
    kind: class
    class: CategoryCharacteristicValue
    note: >-
      discriminator CATEGORICAL (stringValue) | NUMERICAL (doubleValue); UNIQUE (categoryCharacteristicId,
      productVariantVersionId); the trigger trg_check_category_value_product_category checks that the characteristic's
      category is linked to the version's product
    refs:
      - {attr: productVariantVersionId, to: ProductVariantVersion, kind: composition, mult: "1"}
      - {attr: categoryCharacteristicId, to: CategoryCharacteristic, kind: association, mult: "1"}
  ProductVariantVersionToMediaEntity:
    kind: join
    joins: [ProductVariantVersion, Media]
    field: medias
    note: "PRIMARY KEY (productVariantVersionId, mediaId); mediaId is an FK into the Media copy (MediaEntity)"
  TaxRateEntity:
    kind: copy
    copyOf: {TaxRate: [id]}
    fedBy: [tax/tax-rate/created]
    note: existence check of the version creation; FK target of ProductVariantVersionEntity.taxRateId; ProductVariantVersion.taxRate returns the stub
  MediaEntity:
    kind: copy
    copyOf: {Media: [id]}
    fedBy: [media/media/created]
    note: existence check of the version creation; FK target of ProductVariantVersionToMediaEntity.mediaId; ProductVariantVersion.medias returns the stubs

operations:
  # ------------------------------------------------------------------ root queries
  - id: catalog.categories
    kind: query
    trigger: {graphql: Query.categories}
    entry: graphql/Query.kt#fun categories(
    feature: F6
    accesses:
      - {class: Category, mode: read, op: select, shape: list, rows: "all categories (page: first)", via: CategoryConnection.nodes,
         table: CategoryEntity, today: local, at: graphql/Query.kt#return CategoryConnection(}
      - {class: Category, mode: read, op: count, shape: one, when: totalCount selected, via: CategoryConnection.totalCount,
         table: CategoryEntity, today: local, at: graphql/Query.kt#return CategoryConnection(}

  - id: catalog.category
    kind: query
    trigger: {graphql: Query.category}
    entry: graphql/Query.kt#fun category(
    feature: F6
    accesses:
      - {class: Category, mode: read, op: select, shape: batch, rows: 1, via: CategoryRepository.findAllById, table: CategoryEntity,
         today: local, at: graphql/Query.kt#CategoryDataLoader::class}

  - id: catalog.categoryCharacteristic
    kind: query
    trigger: {graphql: Query.categoryCharacteristic}
    entry: graphql/Query.kt#fun categoryCharacteristic(
    feature: F6
    accesses:
      - {class: CategoryCharacteristic, mode: read, op: select, shape: batch, rows: 1, via: CategoryCharacteristicRepository.findAllById,
         table: CategoryCharacteristicEntity, today: local, at: graphql/Query.kt#CategoryCharacteristicDataLoader::class}

  - id: catalog.product
    kind: query
    trigger: {graphql: Query.product}
    entry: graphql/Query.kt#fun product(
    feature: F6
    accesses:
      - {class: Product, mode: read, op: select, shape: batch, rows: 1, via: ProductRepository.findAllById, table: ProductEntity,
         today: local, at: graphql/Query.kt#ProductDataLoader::class, note: "a non-visible product needs an employee"}

  - id: catalog.products
    kind: query
    trigger: {graphql: Query.products}
    entry: graphql/Query.kt#fun products(
    feature: F6
    accesses:
      - {class: Product, mode: read, op: select, shape: list, rows: "visible products (page: first; employees: all)", via: ProductConnection.nodes,
         table: ProductEntity, today: local, at: graphql/Query.kt#return ProductConnection(}
      - {class: Product, mode: read, op: count, shape: one, when: totalCount selected, via: ProductConnection.totalCount,
         table: ProductEntity, today: local, at: graphql/Query.kt#return ProductConnection(}

  # ------------------------------------------------------------------ mutations: categories
  - id: catalog.createCategory
    kind: command
    trigger: {graphql: Mutation.createCategory}
    entry: graphql/Mutation.kt#fun createCategory(
    feature: F4
    transaction: {at: "service/CategoryService.kt#@Transactional", classes: [Category, CategoryCharacteristic], publishInside: true}
    accesses:
      - {class: Category, mode: write, op: insert, shape: one, via: CategoryRepository.save, table: CategoryEntity, today: local,
         at: service/CategoryService.kt#repository.save(category), note: "inserted before the names are validated (rollback undoes it)"}
      - {class: CategoryCharacteristic, mode: write, op: insert, shape: perItem, per: input.categoricalCharacteristics,
         via: CategoryCharacteristicRepository.save, table: CategoryCharacteristicEntity, today: local,
         at: "service/CategoryCharacteristicService.kt#return repository.save(categoryCharacteristic)@1"}
      - {class: CategoryCharacteristic, mode: write, op: insert, shape: perItem, per: input.numericalCharacteristics,
         via: CategoryCharacteristicRepository.save, table: CategoryCharacteristicEntity, today: local,
         at: "service/CategoryCharacteristicService.kt#return repository.save(categoryCharacteristic)@2"}
    publishes:
      - {topic: catalog/category/created, at: service/CategoryService.kt#CatalogEvents.CATEGORY_CREATED, payload: [Category],
         note: "id, name, description (no characteristics)"}

  - id: catalog.createCategoricalCategoryCharacteristic
    kind: command
    trigger: {graphql: Mutation.createCategoricalCategoryCharacteristic}
    entry: graphql/Mutation.kt#fun createCategoricalCategoryCharacteristic(
    feature: F4
    transaction: {at: "service/CategoryCharacteristicService.kt#@Transactional@1", classes: [Category, CategoryCharacteristic], publishInside: false, note: "no event"}
    accesses:
      - {class: Category, mode: read, op: exists, shape: one, strong: true, via: CategoryRepository.existsById, table: CategoryEntity,
         today: local, at: service/CategoryCharacteristicService.kt#categoryRepository.existsById(categoryId)}
      - {class: CategoryCharacteristic, mode: write, op: insert, shape: one, via: CategoryCharacteristicRepository.save,
         table: CategoryCharacteristicEntity, today: local, at: "service/CategoryCharacteristicService.kt#return repository.save(categoryCharacteristic)@1"}

  - id: catalog.createNumericalCategoryCharacteristic
    kind: command
    trigger: {graphql: Mutation.createNumericalCategoryCharacteristic}
    entry: graphql/Mutation.kt#fun createNumericalCategoryCharacteristic(
    feature: F4
    transaction: {at: "service/CategoryCharacteristicService.kt#@Transactional@2", classes: [Category, CategoryCharacteristic], publishInside: false, note: "no event"}
    accesses:
      - {class: Category, mode: read, op: exists, shape: one, strong: true, via: CategoryRepository.existsById, table: CategoryEntity,
         today: local, at: service/CategoryCharacteristicService.kt#categoryRepository.existsById(categoryId)}
      - {class: CategoryCharacteristic, mode: write, op: insert, shape: one, via: CategoryCharacteristicRepository.save,
         table: CategoryCharacteristicEntity, today: local, at: "service/CategoryCharacteristicService.kt#return repository.save(categoryCharacteristic)@2"}

  # ------------------------------------------------------------------ mutations: products
  - id: catalog.createProduct
    kind: command
    trigger: {graphql: Mutation.createProduct}
    entry: graphql/Mutation.kt#fun createProduct(
    feature: F5
    transaction:
      at: "service/ProductService.kt#@Transactional@1"
      classes: [Product, Category, ProductVariant, ProductVariantVersion, TaxRate, Media, CategoryCharacteristic, CategoryCharacteristicValue]
      publishInside: true
      note: >-
        product, its category links, the default variant, its initial version, the version's characteristic values and
        media links in one transaction; the variant row is locked (FOR UPDATE) for the version number
    accesses:
      - {class: Product, mode: write, op: insert, shape: one, via: ProductRepository.save, table: ProductEntity, today: local,
         at: "service/ProductService.kt#val savedProduct = repository.save(product)@1"}
      - {class: Category, mode: read, op: exists, shape: batch, rows: distinct input.categoryIds, when: "categoryIds not empty", strong: true,
         via: ProductService.checkCategoriesExist, table: CategoryEntity, today: local,
         at: "service/ProductService.kt#conditionQueries.existingIds<CategoryEntity>(categoryIds)", note: "one SELECT t.id ... = ANY(ids)"}
      - {class: Product, assoc: Category, mode: write, op: insert, shape: perItem, per: distinct input.categoryIds,
         via: ProductToCategoryRepository.saveAll, table: ProductToCategoryEntity, today: local, at: service/ProductService.kt#productToCategoryRepository.saveAll}
      # createProductVariantInternal (default variant)
      - {class: ProductVariant, mode: write, op: insert, shape: one, via: ProductVariantRepository.save, table: ProductVariantEntity,
         today: local, at: "service/ProductVariantService.kt#val savedProductVariant = repository.save(productVariant)@1"}
      # createProductVariantVersionInternal (initial version)
      - {class: TaxRate, mode: read, op: exists, shape: one, strong: true, via: TaxRateRepository.existsById, table: TaxRateEntity,
         today: copy, at: service/ProductVariantVersionService.kt#taxRateRepository.existsById(input.taxRateId)}
      - {class: Media, mode: read, op: exists, shape: batch, rows: initialVersion.mediaIds, when: "mediaIds not empty", strong: true,
         via: ProductVariantVersionService.checkMediasExist, table: MediaEntity, today: copy,
         at: "service/ProductVariantVersionService.kt#conditionQueries.existingIds<MediaEntity>(mediaIds)", note: "one SELECT t.id ... = ANY(ids)"}
      - {class: ProductVariant, mode: read, op: lock, shape: one, strong: true, via: ProductVariantRepository.lockById, table: ProductVariantEntity,
         today: local, at: service/ProductVariantVersionService.kt#productVariantRepository.lockById(productVariantId),
         note: "SELECT ... FOR UPDATE of the variant just inserted"}
      - {class: ProductVariantVersion, mode: read, op: select, shape: one, strong: true, via: ProductVariantVersionRepository.findMaxVersionByProductVariantId,
         table: ProductVariantVersionEntity, today: local, at: service/ProductVariantVersionService.kt#repository.findMaxVersionByProductVariantId(productVariantId),
         note: "MAX(version) aggregate (NULL here: new variant)"}
      - {class: ProductVariantVersion, mode: write, op: insert, shape: one, via: ProductVariantVersionRepository.save,
         table: ProductVariantVersionEntity, today: local, at: service/ProductVariantVersionService.kt#repository.save(productVariantVersion)}
      # validateCharacteristicIdsForUpsert: one SQL join over six tables
      - {class: ProductVariantVersion, mode: read, op: select, shape: one, when: characteristic values given, strong: true,
         via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: ProductVariantVersionEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(, note: "join statement, see the CategoryCharacteristic access"}
      - {class: ProductVariant, mode: read, op: select, shape: one, when: characteristic values given, strong: true,
         via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: ProductVariantEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(, note: "join statement"}
      - {class: Product, mode: read, op: select, shape: one, when: characteristic values given, strong: true,
         via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: ProductEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(, note: "join statement"}
      - {class: Product, assoc: Category, mode: read, op: select, shape: list, rows: categories of the product, when: characteristic values given,
         strong: true, via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: ProductToCategoryEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(, note: "join statement"}
      - {class: Category, mode: read, op: select, shape: list, rows: categories of the product, when: characteristic values given, strong: true,
         via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: CategoryEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(, note: "join statement"}
      - {class: CategoryCharacteristic, mode: read, op: select, shape: list, rows: "given characteristic ids (IN list)", when: characteristic values given,
         strong: true, via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: CategoryCharacteristicEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(,
         note: "one SELECT DISTINCT joining ProductVariantVersion-ProductVariant-Product-ProductToCategory-Category-CategoryCharacteristic"}
      - {class: CategoryCharacteristicValue, mode: write, op: upsert, shape: perItem, per: initialVersion.categoricalCharacteristicValues,
         via: CategoryCharacteristicValueRepository.upsert, table: CategoryCharacteristicValueEntity, today: local,
         at: "service/CategoryCharacteristicValueService.kt#repository.upsert(@1"}
      - {class: CategoryCharacteristicValue, mode: write, op: upsert, shape: perItem, per: initialVersion.numericalCharacteristicValues,
         via: CategoryCharacteristicValueRepository.upsert, table: CategoryCharacteristicValueEntity, today: local,
         at: "service/CategoryCharacteristicValueService.kt#repository.upsert(@2"}
      # DB trigger per upserted value row
      - {class: ProductVariantVersion, mode: read, op: exists, shape: perItem, per: "upserted values (categorical + numerical)", strong: true,
         dbTrigger: trg_check_category_value_product_category, via: CategoryCharacteristicValueRepository.upsert, table: ProductVariantVersionEntity,
         today: local, at: "src/main/resources/db/migration/V1_1__create_relations.sql#FROM ProductVariantVersionEntity pvve"}
      - {class: ProductVariant, mode: read, op: exists, shape: perItem, per: "upserted values (categorical + numerical)", strong: true,
         dbTrigger: trg_check_category_value_product_category, via: CategoryCharacteristicValueRepository.upsert, table: ProductVariantEntity,
         today: local, at: "src/main/resources/db/migration/V1_1__create_relations.sql#JOIN ProductVariantEntity pve"}
      - {class: Product, assoc: Category, mode: read, op: exists, shape: perItem, per: "upserted values (categorical + numerical)", strong: true,
         dbTrigger: trg_check_category_value_product_category, via: CategoryCharacteristicValueRepository.upsert, table: ProductToCategoryEntity,
         today: local, at: "src/main/resources/db/migration/V1_1__create_relations.sql#JOIN ProductToCategoryEntity pce"}
      - {class: CategoryCharacteristic, mode: read, op: exists, shape: perItem, per: "upserted values (categorical + numerical)", strong: true,
         dbTrigger: trg_check_category_value_product_category, via: CategoryCharacteristicValueRepository.upsert, table: CategoryCharacteristicEntity,
         today: local, at: "src/main/resources/db/migration/V1_1__create_relations.sql#JOIN CategoryCharacteristicEntity cce"}
      - {class: ProductVariantVersion, assoc: Media, mode: write, op: insert, shape: perItem, per: distinct initialVersion.mediaIds,
         via: ProductVariantVersionToMediaRepository.saveAll, table: ProductVariantVersionToMediaEntity, today: local,
         at: service/ProductVariantVersionService.kt#productVariantVersionToMediaRepository.saveAll}
      # back in createProductVariantInternal / createProduct
      - {class: ProductVariant, mode: write, op: update, shape: one, via: ProductVariantRepository.save, table: ProductVariantEntity,
         today: local, at: service/ProductVariantService.kt#repository.save(savedProductVariant), note: "sets currentVersion"}
      - {class: Product, mode: write, op: update, shape: one, via: ProductRepository.save, table: ProductEntity, today: local,
         at: service/ProductService.kt#repository.save(savedProduct), note: "sets defaultVariantId"}
    publishes:
      - {topic: catalog/product/created, at: service/ProductService.kt#CatalogEvents.PRODUCT_CREATED, payload: [Product],
         note: "incl. categoryIds (the Product-Category links from the input)"}
      - {topic: catalog/product-variant/created, at: service/ProductService.kt#CatalogEvents.PRODUCT_VARIANT_CREATED, payload: [ProductVariant]}
      - {topic: catalog/product-variant-version/created, at: service/ProductService.kt#CatalogEvents.PRODUCT_VARIANT_VERSION_CREATED,
         payload: [ProductVariantVersion], note: "incl. taxRateId and mediaIds (from the input)"}

  - id: catalog.createProductVariant
    kind: command
    trigger: {graphql: Mutation.createProductVariant}
    entry: graphql/Mutation.kt#fun createProductVariant(
    feature: F5
    transaction:
      at: "service/ProductVariantService.kt#@Transactional@1"
      classes: [Product, ProductVariant, ProductVariantVersion, TaxRate, Media, Category, CategoryCharacteristic, CategoryCharacteristicValue]
      publishInside: true
      note: variant, its initial version, the version's characteristic values and media links in one transaction; the variant row is locked
    accesses:
      - {class: Product, mode: read, op: exists, shape: one, strong: true, via: ProductRepository.existsById, table: ProductEntity,
         today: local, at: service/ProductVariantService.kt#productRepository.existsById(input.productId)}
      - {class: ProductVariant, mode: write, op: insert, shape: one, via: ProductVariantRepository.save, table: ProductVariantEntity,
         today: local, at: "service/ProductVariantService.kt#val savedProductVariant = repository.save(productVariant)@1"}
      - {class: TaxRate, mode: read, op: exists, shape: one, strong: true, via: TaxRateRepository.existsById, table: TaxRateEntity,
         today: copy, at: service/ProductVariantVersionService.kt#taxRateRepository.existsById(input.taxRateId)}
      - {class: Media, mode: read, op: exists, shape: batch, rows: initialVersion.mediaIds, when: "mediaIds not empty", strong: true,
         via: ProductVariantVersionService.checkMediasExist, table: MediaEntity, today: copy,
         at: "service/ProductVariantVersionService.kt#conditionQueries.existingIds<MediaEntity>(mediaIds)", note: "one SELECT t.id ... = ANY(ids)"}
      - {class: ProductVariant, mode: read, op: lock, shape: one, strong: true, via: ProductVariantRepository.lockById, table: ProductVariantEntity,
         today: local, at: service/ProductVariantVersionService.kt#productVariantRepository.lockById(productVariantId),
         note: "SELECT ... FOR UPDATE of the variant just inserted"}
      - {class: ProductVariantVersion, mode: read, op: select, shape: one, strong: true, via: ProductVariantVersionRepository.findMaxVersionByProductVariantId,
         table: ProductVariantVersionEntity, today: local, at: service/ProductVariantVersionService.kt#repository.findMaxVersionByProductVariantId(productVariantId),
         note: "MAX(version) aggregate (NULL here: new variant)"}
      - {class: ProductVariantVersion, mode: write, op: insert, shape: one, via: ProductVariantVersionRepository.save,
         table: ProductVariantVersionEntity, today: local, at: service/ProductVariantVersionService.kt#repository.save(productVariantVersion)}
      - {class: ProductVariantVersion, mode: read, op: select, shape: one, when: characteristic values given, strong: true,
         via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: ProductVariantVersionEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(, note: "join statement, see the CategoryCharacteristic access"}
      - {class: ProductVariant, mode: read, op: select, shape: one, when: characteristic values given, strong: true,
         via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: ProductVariantEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(, note: "join statement"}
      - {class: Product, mode: read, op: select, shape: one, when: characteristic values given, strong: true,
         via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: ProductEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(, note: "join statement"}
      - {class: Product, assoc: Category, mode: read, op: select, shape: list, rows: categories of the product, when: characteristic values given,
         strong: true, via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: ProductToCategoryEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(, note: "join statement"}
      - {class: Category, mode: read, op: select, shape: list, rows: categories of the product, when: characteristic values given, strong: true,
         via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: CategoryEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(, note: "join statement"}
      - {class: CategoryCharacteristic, mode: read, op: select, shape: list, rows: "given characteristic ids (IN list)", when: characteristic values given,
         strong: true, via: CategoryCharacteristicValueRepository.findValidCategoryCharacteristics, table: CategoryCharacteristicEntity, today: local,
         at: service/CategoryCharacteristicValueService.kt#repository.findValidCategoryCharacteristics(,
         note: "one SELECT DISTINCT joining ProductVariantVersion-ProductVariant-Product-ProductToCategory-Category-CategoryCharacteristic"}
      - {class: CategoryCharacteristicValue, mode: write, op: upsert, shape: perItem, per: initialVersion.categoricalCharacteristicValues,
         via: CategoryCharacteristicValueRepository.upsert, table: CategoryCharacteristicValueEntity, today: local,
         at: "service/CategoryCharacteristicValueService.kt#repository.upsert(@1"}
      - {class: CategoryCharacteristicValue, mode: write, op: upsert, shape: perItem, per: initialVersion.numericalCharacteristicValues,
         via: CategoryCharacteristicValueRepository.upsert, table: CategoryCharacteristicValueEntity, today: local,
         at: "service/CategoryCharacteristicValueService.kt#repository.upsert(@2"}
      - {class: ProductVariantVersion, mode: read, op: exists, shape: perItem, per: "upserted values (categorical + numerical)", strong: true,
         dbTrigger: trg_check_category_value_product_category, via: CategoryCharacteristicValueRepository.upsert, table: ProductVariantVersionEntity,
         today: local, at: "src/main/resources/db/migration/V1_1__create_relations.sql#FROM ProductVariantVersionEntity pvve"}
      - {class: ProductVariant, mode: read, op: exists, shape: perItem, per: "upserted values (categorical + numerical)", strong: true,
         dbTrigger: trg_check_category_value_product_category, via: CategoryCharacteristicValueRepository.upsert, table: ProductVariantEntity,
         today: local, at: "src/main/resources/db/migration/V1_1__create_relations.sql#JOIN ProductVariantEntity pve"}
      - {class: Product, assoc: Category, mode: read, op: exists, shape: perItem, per: "upserted values (categorical + numerical)", strong: true,
         dbTrigger: trg_check_category_value_product_category, via: CategoryCharacteristicValueRepository.upsert, table: ProductToCategoryEntity,
         today: local, at: "src/main/resources/db/migration/V1_1__create_relations.sql#JOIN ProductToCategoryEntity pce"}
      - {class: CategoryCharacteristic, mode: read, op: exists, shape: perItem, per: "upserted values (categorical + numerical)", strong: true,
         dbTrigger: trg_check_category_value_product_category, via: CategoryCharacteristicValueRepository.upsert, table: CategoryCharacteristicEntity,
         today: local, at: "src/main/resources/db/migration/V1_1__create_relations.sql#JOIN CategoryCharacteristicEntity cce"}
      - {class: ProductVariantVersion, assoc: Media, mode: write, op: insert, shape: perItem, per: distinct initialVersion.mediaIds,
         via: ProductVariantVersionToMediaRepository.saveAll, table: ProductVariantVersionToMediaEntity, today: local,
         at: service/ProductVariantVersionService.kt#productVariantVersionToMediaRepository.saveAll}
      - {class: ProductVariant, mode: write, op: update, shape: one, via: ProductVariantRepository.save, table: ProductVariantEntity,
         today: local, at: service/ProductVariantService.kt#repository.save(savedProductVariant), note: "sets currentVersion"}
    publishes:
      - {topic: catalog/product-variant/created, at: service/ProductVariantService.kt#CatalogEvents.PRODUCT_VARIANT_CREATED, payload: [ProductVariant]}
      - {topic: catalog/product-variant-version/created, at: service/ProductVariantService.kt#CatalogEvents.PRODUCT_VARIANT_VERSION_CREATED,
         payload: [ProductVariantVersion], note: "incl. taxRateId and mediaIds (from the input)"}

  - id: catalog.createProductVariantVersion
    kind: command
    trigger: {graphql: Mutation.createProductVariantVersion}
    entry: graphql/Mutation.kt#fun createProductVariantVersion(
    feature: F5
    transaction:
      at: "service/ProductVariantVersionService.kt#@Transactional"
      classes: [ProductVariant, ProductVariantVersion, TaxRate, Media, Product, Category, CategoryCharacteristic, CategoryCharacteristicValue]
      publishInside: true
      note: >-
        the variant row is locked (SELECT ... FOR UPDATE) before MAX(version)+1 (fix, docs/fixes/catalog.md); version,
        values, media links and the variant's currentVersion in one transaction
    accesses:
      - {class: ProductVariant, mode: read, op: exists, shape: one, strong: true, via: ProductVariantRepository.existsById, table: ProductVariantEntity,
         today: local, at: service/ProductVariantVersionService.kt#productVariantRepository.existsById(input.productVariantId)}
      - {class: TaxRate, mode: read, op: exists, shape: one, strong: true, via: TaxRateRepository.existsById, table: TaxRateEntity,
         today: copy, at: service/ProductVariantVersionService.kt#taxRateRepository.existsById(input.taxRateId)}
      - {class: Media, mode: read, op: exists, shape: batch, rows: input.mediaIds, when: "mediaIds not empty", strong: true,
         via: ProductVariantVersionService.checkMediasExist, table: MediaEntity, today: copy,
         at: "service/ProductVariantVersionService.kt#conditionQueries.existingIds<MediaEntity>(mediaIds)", note: "one SELECT t.id ... = ANY(ids)"}
      - {class: ProductVariant, mode: read, op: lock, shape: one, strong: true, via: ProductVariantRepository.lockById, table: ProductVariantEntity,
         today: local, at: service/ProductVariantVersionService.kt#productVariantRepository.lockById(productVariantId)}
