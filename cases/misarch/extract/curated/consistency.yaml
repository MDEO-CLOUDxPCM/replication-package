# Consistency levels of the strong reads and strong calls (DESIGN.md AB60). Curated; schema: build.py docstring.
# Classified read-only against misarch-kotlin 7515717 (every access with mode read and `strong: true`, every call with
# `strong: true`; the code at each access's evidence), then reviewed by the user (AB60: the createReturn split, the
# own-write re-reads as S5, the payload reads as immutable, every other debatable case the classifier's level).
# Since AB63 the extraction reads 201e2e7: registerCoupon's trigger increments the coupon atomically (no strict read).
# Since the unified services (misarch-kotlin unify) the entries follow their code: reads gone with it are dropped,
# merged statements have one entry, a SELECT ... FOR UPDATE that returns the row is its read (op select), not a lock.
#
# A level says which mechanisms a read may have (core/generator/derive.py, F4):
#   strict     sync only (no decision site); a strict read that today's code serves from a copy keeps sync or copy, so
#              today's cut stays representable (return's returnedWithId, payment's open order: the reader's own store)
#   stale-ok   sync, cache or copy, like a read that is not strong; O4 prices a stale read with p = min(1, w x window)
#   immutable  as stale-ok, but O4 counts no staleness (p = 0): the data a stale read returns cannot be wrong, at
#              most missing (a row created a moment ago)
# A site's mechanisms follow the strictest access of its (class, mode) group; O4's p = 0 only when every access of
# the site is immutable. A read that is not strong is stale-ok and has no entry here.
#
# Entries, per operation id: `class` and `assoc` (as in the service's file: the access's identity; without `assoc`
# the entry matches only accesses without one), then as few of `op`, `via`, `at`, `table`, `shape`, `when`,
# `topic` as pick exactly one read access of the operation; `call: <operation>` names a strong call by its callee
# (a call into nested fields by its first field). Not access indices: they move when an access is added.
# build.py stops when a strong read or call has no entry, an entry matches nothing, an entry matches several reads
# or one read twice, an entry matches a read or call that is not strong, or a level or rule is unknown.
# misarch-domain.json carries each entry as the access's or call's `consistency` {level, rules, reason}.
# Effect calls (a registration with an external provider, `effect: true`) are not reads: no entry (AB60).
#
# Changing a level is a one-line change here (then build.py, derive.py; DESIGN.md AB60 lists the debatable ones).

levels:
  strict: "must read current data: sync only (no decision site)"
  stale-ok: "sync, copy (replicationLagSeconds 1 s) or cache (cacheTtlSeconds 60 s), each priced by O4"
  immutable: "stale-ok with zero staleness (p = 0 in O4)"
rules:
  S1: "read-modify-write: the same execution writes the data based on what it read (lost update if stale)"
  S2: "invariant guard not re-checked by a constraint, trigger or compare-and-set in the write"
  S3: "state transition decided by the read state, written without compare-and-set"
  S4: "authorization/ownership (here only together with I1: the owner column never changes, so the check is immutable)"
  S5: "same transaction / lock: the read is under a lock or must see the transaction's own writes"
  S6: "read-your-writes: the caller's own write moments earlier decides the result, which is frozen into a durable record"
  E1: "an effect call (registration with an external provider), not a read: never cache/copy"
  R1: "reference data, rarely written: a stale value is at most a slightly outdated snapshot"
  R2: "re-validated later or atomically in the write (saga step, unique constraint, trigger, compare-and-set)"
  R3: "served from an event-fed copy today and accepted by MiSArch"
  I1: "monotone data: insert-only rows / write-once or never-changing columns read by key; a stale read can only miss a row created a moment ago"

operations:
  address.archiveUserAddress:
    - {class: "UserAddress",
       level: strict, rules: [S1, S4],
       reason: "archiveUserAddress loads the address, checks that the caller owns it and saves the loaded row back with archivedAt set: the write is built from the row it read."}
  address.createUserAddress:
    - {class: "User",
       level: immutable, rules: [I1],
       reason: "createUserAddress only checks that the given user id exists; users are never deleted and address's copy is fed by user/user/created only, so a stale copy can at most miss a user registered a moment ago (a retryable 'not found'), never accept a wrong one."}
  catalog.createCategoricalCategoryCharacteristic:
    - {class: "Category",
       level: immutable, rules: [I1],
       reason: "Categories are insert-only (createCategory is their only writer, nothing updates or deletes them), so the check that the given category exists can only miss one created a moment ago."}
  catalog.createNumericalCategoryCharacteristic:
    - {class: "Category",
       level: immutable, rules: [I1],
       reason: "Categories are insert-only (createCategory is their only writer, nothing updates or deletes them), so the check that the given category exists can only miss one created a moment ago."}
  catalog.createProduct:
    - {class: "Category", op: "exists",
       level: immutable, rules: [I1],
       reason: "Categories are insert-only (createCategory is their only writer, nothing updates or deletes them), so the check that the given category exists can only miss one created a moment ago."}
    - {class: "TaxRate",
       level: immutable, rules: [I1],
       reason: "Tax rates are never deleted (tax has create and update only; catalog's copy is fed by tax-rate/created), so the check that the version's tax rate exists can only miss a rate created a moment ago."}
    - {class: "Media",
       level: immutable, rules: [I1],
       reason: "Media rows are insert-only for catalog: media deletes a stored object only when its created event could not be published, so catalog never sees it; a stale copy can only miss a media uploaded a moment ago."}
    - {class: "ProductVariant", op: "lock",
       level: strict, rules: [S5],
       reason: "A statement that only locks (SELECT ... FOR UPDATE without a data change, or a transaction-scoped advisory lock on the id) serialises this transaction's write of the class: a lock is always taken on the current row, at the class's own store, never on a copy or a cache."}
    - {class: "ProductVariantVersion", op: "select", via: "ProductVariantVersionRepository.findMaxVersionByProductVariantId",
       level: strict, rules: [S1, S5],
       reason: "createProduct computes the next version number as MAX(version)+1 of the variant's versions under the variant's lock and inserts it: a stale maximum would give two versions the same number. (Here always NULL: the variant is new.)"}
    - {class: "ProductVariantVersion", op: "select", via: "CategoryCharacteristicValueRepository.findValidCategoryCharacteristics",
       level: strict, rules: [S5],
       reason: "The characteristic validation (one join, findValidCategoryCharacteristics) reads the version row that createProduct inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "ProductVariant", op: "select",
       level: strict, rules: [S5],
       reason: "The characteristic validation (one join, findValidCategoryCharacteristics) reads the variant row that createProduct inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "Product",
       level: strict, rules: [S5],
       reason: "The characteristic validation (one join, findValidCategoryCharacteristics) reads the product row that createProduct inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "Product", assoc: "Category", op: "select",
       level: strict, rules: [S5],
       reason: "The characteristic validation (one join, findValidCategoryCharacteristics) reads the product's category links that createProduct inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "Category", op: "select",
       level: immutable, rules: [I1],
       reason: "The join reads the categories of the product; categories are insert-only, their rows cannot be stale."}
    - {class: "CategoryCharacteristic", op: "select",
       level: immutable, rules: [I1],
       reason: "Category characteristics are insert-only (created with their category or by the create...Characteristic mutations, never updated or deleted): the category a characteristic belongs to cannot change."}
    - {class: "ProductVariantVersion", op: "exists",
       level: strict, rules: [S5],
       reason: "The trigger check_category_value_product_category_fn, fired by each characteristic value upsert, reads the version row inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "ProductVariant", op: "exists",
       level: strict, rules: [S5],
       reason: "The trigger check_category_value_product_category_fn, fired by each characteristic value upsert, reads the variant row inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "Product", assoc: "Category", op: "exists",
       level: strict, rules: [S5],
       reason: "The trigger check_category_value_product_category_fn, fired by each characteristic value upsert, reads the product's category links inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "CategoryCharacteristic", op: "exists",
       level: immutable, rules: [I1],
       reason: "Category characteristics are insert-only (created with their category or by the create...Characteristic mutations, never updated or deleted): the category a characteristic belongs to cannot change."}
  catalog.createProductVariant:
    - {class: "Product", op: "exists",
       level: immutable, rules: [I1],
       reason: "createProductVariant only checks that the parent product exists; products are never deleted, so the check can only miss a product created a moment ago."}
    - {class: "TaxRate",
       level: immutable, rules: [I1],
       reason: "Tax rates are never deleted (tax has create and update only; catalog's copy is fed by tax-rate/created), so the check that the version's tax rate exists can only miss a rate created a moment ago."}
    - {class: "Media",
       level: immutable, rules: [I1],
       reason: "Media rows are insert-only for catalog: media deletes a stored object only when its created event could not be published, so catalog never sees it; a stale copy can only miss a media uploaded a moment ago."}
    - {class: "ProductVariant", op: "lock",
       level: strict, rules: [S5],
       reason: "A statement that only locks (SELECT ... FOR UPDATE without a data change, or a transaction-scoped advisory lock on the id) serialises this transaction's write of the class: a lock is always taken on the current row, at the class's own store, never on a copy or a cache."}
    - {class: "ProductVariantVersion", op: "select", via: "ProductVariantVersionRepository.findMaxVersionByProductVariantId",
       level: strict, rules: [S1, S5],
       reason: "createProductVariant computes the next version number as MAX(version)+1 of the variant's versions under the variant's lock and inserts it: a stale maximum would give two versions the same number. (Here always NULL: the variant is new.)"}
    - {class: "ProductVariantVersion", op: "select", via: "CategoryCharacteristicValueRepository.findValidCategoryCharacteristics",
       level: strict, rules: [S5],
       reason: "The characteristic validation (one join, findValidCategoryCharacteristics) reads the version row that createProductVariant inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "ProductVariant", op: "select",
       level: strict, rules: [S5],
       reason: "The characteristic validation (one join, findValidCategoryCharacteristics) reads the variant row that createProductVariant inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "Product", op: "select",
       level: immutable, rules: [I1],
       reason: "The join follows the variant to its product; a variant's productId and the product's id never change (updateProduct changes name, visibility and default variant only)."}
    - {class: "Product", assoc: "Category", op: "select",
       level: immutable, rules: [I1],
       reason: "A product's category links are written only by createProduct and never changed afterwards, so the links read here cannot be stale."}
    - {class: "Category",
       level: immutable, rules: [I1],
       reason: "The join reads the categories of the product; categories are insert-only, their rows cannot be stale."}
    - {class: "CategoryCharacteristic", op: "select",
       level: immutable, rules: [I1],
       reason: "Category characteristics are insert-only (created with their category or by the create...Characteristic mutations, never updated or deleted): the category a characteristic belongs to cannot change."}
    - {class: "ProductVariantVersion", op: "exists",
       level: strict, rules: [S5],
       reason: "The trigger check_category_value_product_category_fn, fired by each characteristic value upsert, reads the version row inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "ProductVariant", op: "exists",
       level: strict, rules: [S5],
       reason: "The trigger check_category_value_product_category_fn, fired by each characteristic value upsert, reads the variant row inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "Product", assoc: "Category", op: "exists",
       level: immutable, rules: [I1],
       reason: "A product's category links are written only by createProduct and never changed afterwards, so the links read here cannot be stale."}
    - {class: "CategoryCharacteristic", op: "exists",
       level: immutable, rules: [I1],
       reason: "Category characteristics are insert-only (created with their category or by the create...Characteristic mutations, never updated or deleted): the category a characteristic belongs to cannot change."}
  catalog.createProductVariantVersion:
    - {class: "ProductVariant", op: "exists", via: "ProductVariantRepository.existsById",
       level: immutable, rules: [I1],
       reason: "The check that the given variant exists cannot be wrong: variants are never deleted (the strict lock and the re-read of the same row follow anyway)."}
    - {class: "TaxRate",
       level: immutable, rules: [I1],
       reason: "Tax rates are never deleted (tax has create and update only; catalog's copy is fed by tax-rate/created), so the check that the version's tax rate exists can only miss a rate created a moment ago."}
    - {class: "Media",
       level: immutable, rules: [I1],
       reason: "Media rows are insert-only for catalog: media deletes a stored object only when its created event could not be published, so catalog never sees it; a stale copy can only miss a media uploaded a moment ago."}
    - {class: "ProductVariant", op: "lock",
       level: strict, rules: [S5],
       reason: "A statement that only locks (SELECT ... FOR UPDATE without a data change, or a transaction-scoped advisory lock on the id) serialises this transaction's write of the class: a lock is always taken on the current row, at the class's own store, never on a copy or a cache."}
    - {class: "ProductVariantVersion", op: "select", via: "ProductVariantVersionRepository.findMaxVersionByProductVariantId",
       level: strict, rules: [S1, S5],
       reason: "createProductVariantVersion computes the next version number as MAX(version)+1 of the variant's versions under the variant's lock and inserts it: a stale maximum would give two versions the same number."}
    - {class: "ProductVariantVersion", op: "select", via: "CategoryCharacteristicValueRepository.findValidCategoryCharacteristics",
       level: strict, rules: [S5],
       reason: "The characteristic validation (one join, findValidCategoryCharacteristics) reads the version row that createProductVariantVersion inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "ProductVariant", op: "select", via: "CategoryCharacteristicValueRepository.findValidCategoryCharacteristics",
       level: immutable, rules: [I1],
       reason: "The join only follows the existing variant's productId, which is set at creation and never changes."}
    - {class: "Product",
       level: immutable, rules: [I1],
       reason: "The join follows the variant to its product; a variant's productId and the product's id never change (updateProduct changes name, visibility and default variant only)."}
    - {class: "Product", assoc: "Category", op: "select",
       level: immutable, rules: [I1],
       reason: "A product's category links are written only by createProduct and never changed afterwards, so the links read here cannot be stale."}
    - {class: "Category",
       level: immutable, rules: [I1],
       reason: "The join reads the categories of the product; categories are insert-only, their rows cannot be stale."}
    - {class: "CategoryCharacteristic", op: "select",
       level: immutable, rules: [I1],
       reason: "Category characteristics are insert-only (created with their category or by the create...Characteristic mutations, never updated or deleted): the category a characteristic belongs to cannot change."}
    - {class: "ProductVariantVersion", op: "exists",
       level: strict, rules: [S5],
       reason: "The trigger check_category_value_product_category_fn, fired by each characteristic value upsert, reads the version row inserted earlier in the same transaction: only the transaction itself sees it."}
    - {class: "ProductVariant", op: "exists", via: "CategoryCharacteristicValueRepository.upsert",
       level: immutable, rules: [I1],
       reason: "The join only follows the existing variant's productId, which is set at creation and never changes."}
    - {class: "Product", assoc: "Category", op: "exists",
       level: immutable, rules: [I1],
       reason: "A product's category links are written only by createProduct and never changed afterwards, so the links read here cannot be stale."}
    - {class: "CategoryCharacteristic", op: "exists",
       level: immutable, rules: [I1],
       reason: "Category characteristics are insert-only (created with their category or by the create...Characteristic mutations, never updated or deleted): the category a characteristic belongs to cannot change."}
    - {class: "ProductVariant", op: "select", via: "ProductVariantRepository.findById",
       level: strict, rules: [S1],
       reason: "createProductVariantVersion loads the variant and saves the whole row back with currentVersion set to the new version: a stale row would overwrite a concurrent change (e.g. its visibility) with the old value."}
  catalog.updateProduct:
    - {class: "Product",
       level: strict, rules: [S1],
       reason: "updateProduct loads the product and saves the whole row back with the changed fields: a stale row would undo a concurrent update."}
    - {class: "ProductVariant",
       level: immutable, rules: [I1],
       reason: "updateProduct only checks that the new default variant belongs to the product; a variant's productId is set at creation and never changes, and variants are never deleted."}
  catalog.updateProductVariant:
    - {class: "ProductVariant",
       level: strict, rules: [S1],
       reason: "updateProductVariant loads the variant and saves the whole row back with the new visibility: a stale row would undo a concurrent change (e.g. a new currentVersion)."}
  discount.createCoupon:
    - {class: "Discount",
       level: immutable, rules: [I1],
       reason: "createCoupon only checks that the coupon's discount exists; discounts are never deleted (create and update only)."}
    - {class: "Coupon",
       level: stale-ok, rules: [R2],
       reason: "The 'code must be unused' check is repeated by the UNIQUE (code) constraint of the insert, so a stale answer only changes the error message."}
  discount.createDiscount:
    - {class: "Category",
       level: immutable, rules: [I1],
       reason: "createDiscount only checks that each category the discount applies to exists in discount's copy; categorys are never deleted, so a stale copy can only miss one created a moment ago."}
    - {class: "Product",
       level: immutable, rules: [I1],
       reason: "createDiscount only checks that each product the discount applies to exists in discount's copy; products are never deleted, so a stale copy can only miss one created a moment ago."}
    - {class: "ProductVariant",
       level: immutable, rules: [I1],
       reason: "createDiscount only checks that each product variant the discount applies to exists in discount's copy; variants are never deleted, so a stale copy can only miss one created a moment ago."}
  discount.findApplicableDiscounts:
    - {class: "ProductVariant",
       level: immutable, rules: [I1],
       reason: "findApplicableDiscounts only checks that each given variant id exists in discount's copy; variants are never deleted, so a stale copy can only miss a variant created a moment ago."}
    - {class: "Coupon",
       level: immutable, rules: [I1],
       reason: "The given coupons must exist and each names its discount; coupons are never deleted and updateCoupon never changes a coupon's discount (only code, validity and maxUsages), so what is read here cannot be stale."}
  "discount.on:inventory/product-item/reservation-succeeded":
    - {class: "Discount", via: "DiscountRepository.findAllById",
       level: stale-ok, rules: [R1, R2],
       reason: "The handler reads each discount's per-user limit (maxUsagesPerUser), admin data that changes rarely; the usage upsert's trigger check_discount_usages checks the limit again in the write, so a stale limit at most decides which result event is published."}
    - {class: "DiscountUsage",
       level: stale-ok, rules: [R2],
       reason: "The user's current usages decide success or failure, but the upsert adds the count atomically (usages = usages + n) and the trigger check_discount_usages re-checks the limit in the same statement: a stale count only changes the failure event (validation-failed with an empty list instead of the failing discounts)."}
    - {class: "Discount", via: "DiscountUsageRepository.upsertDiscountUsage",
       level: stale-ok, rules: [R1],
       reason: "The trigger check_discount_usages compares the new usage count (computed atomically in the statement) with the discount's maxUsagesPerUser, an admin setting that changes rarely: a stale limit could allow at most the old limit shortly after an admin lowered it."}
  discount.registerCoupon:
    - {class: "Coupon", via: "CouponRepository.findByCode",
       level: stale-ok, rules: [R1],
       reason: "registerCoupon finds the coupon by its code and checks its validity window; code and window are admin data that change rarely, so a stale coupon could at most accept a redemption shortly after an admin closed the window; the usage limit itself is checked in the write, by the trigger update_coupon_usages's atomic increment (UPDATE ... RETURNING)."}
  discount.updateCoupon:
    - {class: "Coupon",
       level: strict, rules: [S1],
       reason: "updateCoupon loads the coupon and saves its admin fields (code, validity window, maxUsages) back with the changed ones: a stale row would undo a concurrent update of the others (lost update); usages is never written (@ReadOnlyProperty, counted by the trigger update_coupon_usages)."}
  discount.updateDiscount:
    - {class: "Discount",
       level: strict, rules: [S1],
       reason: "updateDiscount loads the discount and saves the whole row back with the changed fields: a stale row would undo a concurrent update."}
    - {class: "Category",
       level: immutable, rules: [I1],
       reason: "updateDiscount only checks that each category the discount applies to exists in discount's copy; categorys are never deleted, so a stale copy can only miss one created a moment ago."}
    - {class: "Product",
       level: immutable, rules: [I1],
       reason: "updateDiscount only checks that each product the discount applies to exists in discount's copy; products are never deleted, so a stale copy can only miss one created a moment ago."}
    - {class: "ProductVariant",
       level: immutable, rules: [I1],
       reason: "updateDiscount only checks that each product variant the discount applies to exists in discount's copy; variants are never deleted, so a stale copy can only miss one created a moment ago."}
  inventory.createProductItemBatch:
    - {class: "ProductVariant",
       level: immutable, rules: [I1],
       reason: "inventory only checks that the variant exists in its copy (ProductVariantEntity, fed by product-variant/created); variants are never deleted, so a stale copy can only miss one created a moment ago."}
  "inventory.on:order/order/created":
    - {class: "Order",
       level: immutable, rules: [I1],
       reason: "The order id comes with the event (event-carried, it never changes)."}
    - {class: "OrderItem",
       level: immutable, rules: [I1],
       reason: "Variant id and count of each item come with the event; order items are insert-only, so the payload is never stale."}
    - {class: "ProductItem",
       level: strict, rules: [S1],
       reason: "The handler counts the items already reserved for this order and reserves only the missing ones (idempotency): a stale count would reserve a second set of items on a redelivered event."}
  inventory.updateProductItem:
    - {class: "ProductVariant",
       level: immutable, rules: [I1],
       reason: "inventory only checks that the variant exists in its copy (ProductVariantEntity, fed by product-variant/created); variants are never deleted, so a stale copy can only miss one created a moment ago."}
    - {class: "ProductItem",
       level: strict, rules: [S1],
       reason: "updateProductItem loads the item and saves the whole row back with the new variant and status (keeping its orderId): a stale row would undo a concurrent reservation or release."}
  "invoice.on:discount/order/validation-succeeded":
    - {class: "Order",
       level: immutable, rules: [I1],
       reason: "The order (user, invoice address, VAT number, amount) comes with the event: an event-carried snapshot that never changes."}
    - {class: "OrderItem",
       level: immutable, rules: [I1],
       reason: "The order items rendered into the invoice come with the event; order items are insert-only."}
    - {class: "Invoice",
       level: stale-ok, rules: [R2],
       reason: "The 'invoice already exists' check is repeated by the unique index on orderId: a second insert fails and rolls the transaction back with its publish, so a stale answer cannot produce a second invoice."}
    - {class: "UserAddress",
       level: immutable, rules: [I1],
       reason: "The invoice address is read by its id; address contents are never edited (address has create and archive only) and invoice reads archived addresses too, so the row cannot be stale."}
    - {class: "VendorAddress",
       level: immutable, rules: [I1],
       reason: "invoice takes the first complete vendor address in insertion order; vendor addresses are insert-only, so once one exists the first one never changes."}
    - {class: "User",
       level: stale-ok, rules: [R1, R3],
       reason: "The customer's first and last name are printed on the invoice; a name changed by updateUser just before would appear in its old form (invoice's copy is in fact never updated today: no event announces a user update, AB40)."}
  notification.createNotification:
    - {class: "User",
       level: immutable, rules: [I1],
       reason: "createNotification only checks that the given user id exists; users are never deleted and notification's copy is fed by user/user/created only, so a stale copy can only miss a user registered a moment ago."}
  "notification.on:notification/notification/create":
    - {class: "User",
       level: immutable, rules: [I1],
       reason: "the handler only checks that the given user id exists; users are never deleted and notification's copy is fed by user/user/created only, so a stale copy can only miss a user registered a moment ago."}
  notification.updateNotification:
    - {class: "Notification",
       level: strict, rules: [S1, S4],
       reason: "updateNotification loads the notification, checks that the caller owns it (else admin) and saves the loaded row back with the read flag and dateRead: the write is built from the row it read."}
  order.createOrder:
    - {class: "User",
       level: immutable, rules: [I1],
       reason: "createOrder only checks that the given user id exists; users are never deleted and order's key's copy is fed by user/user/created only, so a stale copy can only miss a user registered a moment ago."}
    - {class: "ShipmentMethod", op: "select",
       level: immutable, rules: [I1, R2],
       reason: "Every shipment method id must exist; methods are never deleted (archiving only sets archivedAt), and S23 (calculateShipmentFees) checks them again, rejecting unknown and archived ones."}
    - {class: "Coupon", op: "select",
       level: immutable, rules: [I1, R2],
       reason: "Every coupon id must exist; coupons are never deleted, and S22 (findApplicableDiscounts) checks the coupons again."}
    - {class: "UserAddress",
       level: stale-ok, rules: [R3],
       reason: "Both addresses must be active addresses of the buyer; an address archived just before (within the copy's lag) could still be accepted, as MiSArch accepts today with its user_addresses copy; an address's owner never changes."}
    - {class: "ShoppingCartItem",
       level: strict, rules: [S6],
       reason: "createOrder maps the given cart item ids to the variant and the count it reads from the cart (S20) and freezes that count into the order: a stale cart would order the count from before the buyer's last change, or fail with 'not found' for an item the buyer just added."}
    - {class: "ProductVariant",
       level: stale-ok, rules: [R1, R3],
       reason: "Only the variant's visibility is read (invisible variants are dropped); a variant hidden just before could still be ordered, a snapshot MiSArch accepts today with its product_variants copy."}
    - {class: "ProductVariantVersion", op: "select",
       level: stale-ok, rules: [R1, R3],
