         via: PaymentInformationConnection.totalCount, table: PaymentInformationEntity, today: local, at: graphql/Query.kt#PaymentInformationConnection(}
      - {class: PaymentInformation, mode: read, op: exists, shape: optional, when: hasNextPage selected,
         via: PaymentInformationConnection.nodes, table: PaymentInformationEntity, today: local, at: graphql/Query.kt#PaymentInformationConnection(,
         note: "probe: SELECT 1 ... LIMIT 1 OFFSET first + skip"}

