      - {class: Payment, mode: read, op: count, shape: one, when: totalCount selected, via: PaymentConnection.totalCount,
         table: PaymentEntity, today: local, at: graphql/Query.kt#PaymentConnection(}
      - {class: Payment, mode: read, op: exists, shape: optional, when: hasNextPage selected, via: PaymentConnection.nodes,
