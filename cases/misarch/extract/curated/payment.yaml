# payment (Kotlin port of the NestJS/Mongo original). Curated; schema: build.py docstring. Anchors are relative to
# services/payment/src/main/kotlin/org/misarch/payment/.
service: payment
transactional: >-
  @Transactional service methods (service/PaymentService.kt, service/PaymentInformationService.kt). The processing
  is awaited in the handlers (docs/fixes/payment.md P12): validation-succeeded stores the open order and the PENDING
  payment in one short transaction (createPayment), then registers the payment at the provider outside any
  transaction and publishes payment-enabled (INVOICE, CREDIT_CARD); a failed registration removes the payment again
  (discardPayment) and fails the event (redelivery). The provider callback locks the payment (SELECT ... FOR UPDATE),
  applies the status and publishes inside its transaction; a credit-card retry is registered after the commit.
  Publishes go through libs/common EventPublisher.publishEvent; a failing publish rolls back and fails the request.
branchProbabilities: >-
  payment method mix of the placed orders (method of the buyer's first payment information, as the loadgen pays):
  INVOICE 0.445, PREPAYMENT 0.416, CREDIT_CARD 0.139 (misarch-optimization msa/KOTLIN-MODEL.md, round-1 seed);
  provider success rate s = 0.95 (simulation config/SimulationVariables.kt PAYMENT_SUCCESS_RATE default). Per order
  there are 1 + CC*(f + f^2 + f^3) = 1.0073 status callbacks (f = 0.05); the callback probabilities below are per
  callback.

tables:
  PaymentInformationEntity:
    kind: class
    class: PaymentInformation
    refs:
      - {attr: userId, to: User, kind: association, mult: "1", note: "no User copy in payment: the id only"}
    note: >-
      default PREPAYMENT and INVOICE informations per user (created on user/user/created), CREDIT_CARD ones by the buyer;
      the details are JSON columns
  PaymentEntity:
    kind: class
    class: Payment
    refs:
      - {attr: paymentInformationId, to: PaymentInformation, kind: association, mult: "1", note: "no FK; index"}
    note: "totalAmount is a snapshot of the order's compensatableOrderAmount"
  OpenOrderEntity:
    kind: copy
    copyOf:
      Order: [id, userId, createdAt, orderStatus, placedAt, rejectionReason, shipmentAddressId, invoiceAddressId,
              compensatableOrderAmount, paymentInformationId, paymentAuthorization, vatNumber]
      OrderItem: [id, createdAt, productVariantVersionId, productVariantId, taxRateVersionId, shoppingCartItemId, count,
                  compensatableAmount, shipmentMethodId, discountIds]
    fedBy: [discount/order/validation-succeeded]
    process: true
    own:
      paymentId: "the Payment of the order (Payment 1 - 1 Order), primary key"
      orderId: "the order id extracted from the JSON, UNIQUE (fix P4: one payment per order)"
    refs:
      - {attr: paymentId, to: Payment, kind: association, mult: "1", note: "Payment -> Order association lives in the copy row"}
    note: >-
      the order as received in the saga message, kept verbatim as JSON (orderJson, order with its orderItems); written
      once at payment start, read to build the payment-enabled / payment-failed payload of the callback and the jobs;
      deleted only with a payment whose registration failed (discardPayment)

