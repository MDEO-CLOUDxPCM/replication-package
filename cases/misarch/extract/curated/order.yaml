  - id: order.on:shipment/shipment/creation-failed
    kind: reaction
    trigger: {topic: shipment/shipment/creation-failed}
    entry: event/EventController.kt#fun onShipmentCreationFailed(
    feature: F17
    sagaStep: {saga: Buy, role: compensation}
    note: >-
      a failed return shipment (no orderId) is acknowledged without action; compensates the listed items that are not
      compensated yet; the whole handler is one transaction (OrderCompensationService.compensateOrderItems), the
      publish inside it
    transaction:
      at: service/OrderCompensationService.kt#@Transactional
      classes: [OrderCompensation]
      publishInside: true
      note: "compensateOrderItems: the reads, the compensation row, one OrderCompensationToOrderItemEntity row per compensated item, the publish"
    accesses:
      - {class: Shipment, mode: read, shape: one, today: payload, topic: shipment/shipment/creation-failed,
         at: "service/OrderCompensationService.kt#val orderId = shipmentFailedDTO.orderId ?: return", note: "orderId and orderItemIds of the failed shipment"}
      - {class: Order, mode: read, op: exists, shape: one, when: "orderId present", strong: true, via: OrderRepository.existsById, table: OrderEntity, today: local,
         at: service/OrderCompensationService.kt#orderRepository.existsByIdOrThrow(orderId), note: "the order must exist"}
      - {class: OrderCompensation, mode: read, op: select, shape: list, rows: "compensations of the order", when: "orderId present", strong: true,
         via: OrderCompensationToOrderItemRepository.findByOrderId, table: OrderCompensationEntity, today: local,
         at: service/OrderCompensationService.kt#orderCompensationToOrderItemRepository.findByOrderId(orderId),
         note: "already compensated item ids: OrderCompensationToOrderItemEntity JOIN OrderCompensationEntity WHERE orderId"}
      - {class: OrderCompensation, assoc: OrderItem, mode: read, op: select, shape: list, rows: "compensated items of the order", when: "orderId present",
         strong: true, via: OrderCompensationToOrderItemRepository.findByOrderId, table: OrderCompensationToOrderItemEntity, today: local,
         at: service/OrderCompensationService.kt#orderCompensationToOrderItemRepository.findByOrderId(orderId), note: "same statement (the join)"}
      - {class: OrderItem, mode: read, op: select, shape: list, rows: "items of the order", when: "orderId present", strong: true,
         via: OrderItemRepository.findByOrderIdOrderByPosition, table: OrderItemEntity, today: local,
         at: service/OrderCompensationService.kt#orderItemRepository.findByOrderIdOrderByPosition(orderId),
         note: "compensatable amounts of the listed items"}
      - {class: OrderCompensation, mode: write, op: insert, shape: one, when: "uncompensated items listed", via: OrderCompensationRepository.save,
         table: OrderCompensationEntity, today: local, at: service/OrderCompensationService.kt#val compensation = repository.save(}
      - {class: OrderCompensation, assoc: OrderItem, mode: write, op: insert, shape: perItem, per: "the compensated items (one INSERT each)",
         when: "uncompensated items listed", via: OrderCompensationToOrderItemRepository.saveAll, table: OrderCompensationToOrderItemEntity, today: local,
         at: "service/OrderCompensationService.kt#orderCompensationToOrderItemRepository.saveAll(", note: "same transaction"}
    publishes:
      - {topic: order/order-compensation/created, at: "service/OrderCompensationService.kt#OrderEvents.ORDER_COMPENSATION_CREATED",
         payload: [OrderCompensation], when: "a compensation was stored", note: "no subscriber; inside the transaction"}
