  - id: discount.on:inventory/product-item/reservation-succeeded
    kind: reaction
    trigger: {topic: inventory/product-item/reservation-succeeded}
    entry: event/EventController.kt#suspend fun onInventoryReserved(
    feature: F19
    sagaStep: {saga: Buy, role: step}
    note: >-
      checks the per-user usage limits of the order's discounts (not whether they apply) and counts the usages; the
      result event is published inside the transaction; on any exception (e.g. a trigger rejecting a concurrent order)
      rollback and validation-failed with no failing discount ids, published outside the transaction; the foreign key
      DiscountUsageEntity.userId -> UserEntity (the id copy) is no access: it exists only because of the copy, and
      createOrder has checked the buyer (DESIGN.md AB40)
    transaction:
      at: service/DiscountUsageService.kt#@Transactional
      classes: [DiscountUsage]
      publishInside: true
      note: "DiscountUsageService.validateOrder: reads, usage upserts (with trigger reads of DiscountEntity) and the result event"
    accesses:
      - {class: Order, mode: read, shape: one, today: payload, topic: inventory/product-item/reservation-succeeded,
         at: event/EventController.kt#discountService.validateOrder(cloudEvent.data.order), note: "userId (and the whole order, re-published)"}
      - {class: OrderItem, mode: read, shape: list, rows: "items of the order", today: payload, topic: inventory/product-item/reservation-succeeded,
         at: event/EventController.kt#discountService.validateOrder(cloudEvent.data.order), note: "count per item"}
      - {class: OrderItem, assoc: Discount, mode: read, shape: list, rows: "discounts of the order items", today: payload, topic: inventory/product-item/reservation-succeeded,
         at: event/EventController.kt#discountService.validateOrder(cloudEvent.data.order), note: "discountIds per item"}
      - {class: Discount, mode: read, op: select, shape: batch, rows: "distinct discounts of the order", when: "the order has discounts", strong: true,
         via: DiscountRepository.findAllById, table: DiscountEntity, today: local, at: service/DiscountUsageService.kt#discountRepository.findAllById(orderItemsByDiscount.keys),
         note: "maxUsagesPerUser; Spring Data issues no statement for an empty id list"}
      - {class: DiscountUsage, mode: read, op: select, shape: batch, rows: "discounts of the order with maxUsagesPerUser", strong: true,
         via: DiscountUsageRepository.findByUserIdAndDiscountIdIn, table: DiscountUsageEntity, today: local,
         at: "service/DiscountUsageService.kt#repository.findByUserIdAndDiscountIdIn(userId, discountIds)",
         note: "the user's current usages; also called with an empty id set"}
      - {class: DiscountUsage, mode: write, op: upsert, shape: perItem, per: "distinct discounts of the order", when: "no discount over its limit",
         via: DiscountUsageRepository.upsertDiscountUsage, table: DiscountUsageEntity, today: local,
         at: "service/DiscountUsageService.kt#repository.upsertDiscountUsage(discount, order.userId", note: "usages += count of the items"}
      - {class: Discount, mode: read, op: select, shape: perItem, per: "distinct discounts of the order", when: "no discount over its limit", strong: true,
         via: DiscountUsageRepository.upsertDiscountUsage, table: DiscountEntity, today: local,
         at: "service/DiscountUsageService.kt#repository.upsertDiscountUsage(discount, order.userId",
         note: "trigger check_discount_usages in the same statement (maxUsagesPerUser; fires on the insert attempt and on the conflict update)"}
    publishes:
      - {topic: discount/order/validation-failed, at: "service/DiscountUsageService.kt#DiscountEvents.VALIDATION_FAILED, ValidationFailedDTO(order, failedDiscounts)",
         payload: [Order, OrderItem], when: "a discount is over the user's limit", note: "inside the transaction; with the failing discount ids"}
      - {topic: discount/order/validation-succeeded, at: service/DiscountUsageService.kt#DiscountEvents.VALIDATION_SUCCEEDED, payload: [Order, OrderItem],
         when: "all discounts within their limits", note: "inside the transaction"}
      - {topic: discount/order/validation-failed, at: "service/DiscountService.kt#DiscountEvents.VALIDATION_FAILED, ValidationFailedDTO(order, emptyList())",
         payload: [Order, OrderItem], when: "exception in the transaction (rolled back)", note: "outside the transaction"}
