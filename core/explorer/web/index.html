<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Cut Explorer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='%232a78d6'/%3E%3Crect x='18' y='2' width='12' height='12' rx='3' fill='%23eb6834'/%3E%3Crect x='2' y='18' width='12' height='12' rx='3' fill='%231baf7a'/%3E%3Crect x='18' y='18' width='12' height='12' rx='3' fill='%23898781'/%3E%3C/svg%3E" />
    <script>
      // apply the theme before the first paint (no flash)
      try {
        var t = localStorage.getItem('explorer-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
